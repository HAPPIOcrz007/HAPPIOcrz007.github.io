<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CP Daily Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="cp-daily-log_css/style.css">
</head>

<body>
  <header class="top noprint">
    <h1><a href="https://happiocrz007.github.io/" target="_blank" rel="noopener">CP Daily Log</a></h1>
    <div class="actions">
      <select id="theme" aria-label="Theme"></select>
      <button id="printBtn" class="btn primary">Print report</button>
      <button id="clearBtn" class="btn ghost">New day</button>
    </div>
  </header>

  <main>
    <section class="card profile noprint">
      <input id="pName" placeholder="Your name">
      <input id="pCf" placeholder="Codeforces ID">
      <input id="pLc" placeholder="LeetCode ID">
    </section>

    <section class="print-head">
      <div class="ph-top">
        <div>
          <div class="ph-kicker">Competitive Programming · Daily Report</div>
          <h2 id="rName"></h2>
        </div>
        <div class="ph-date" id="rDate"></div>
      </div>
      <div class="ph-links" id="rLinks"></div>
    </section>

    <section class="stats" id="stats"></section>
    <section class="card">
      <h3>Problems per hour &amp; difficulty over the day</h3>
      <div id="chart"></div>
    </section>

    <section class="platforms">
      <div id="plat-cf" class="card plat"></div>
      <div id="plat-lc" class="card plat"></div>
    </section>

    <section id="entries"></section>
    <section id="active" class="noprint"></section>
    <footer class="print-foot">Generated with CP Daily Log</footer>
  </main>

  <div id="modal" class="modal hidden noprint" role="dialog" aria-modal="true"></div>

  <script src="cp-daily-log_js/store.js?v=20261020"></script>
  <script src="cp-daily-log_js/theme.js?v=20261020"></script>
  <script src="cp-daily-log_js/highlight.js?v=20261020"></script>
  <script src="cp-daily-log_js/markdown.js?v=20261020"></script>
  <script src="cp-daily-log_js/charts.js?v=20261020"></script>
  <script src="cp-daily-log_js/timer.js?v=20261020"></script>
  <script src="cp-daily-log_js/entries.js?v=20261020"></script>
  <script src="cp-daily-log_js/report.js?v=20261020"></script>
  <script src="cp-daily-log_js/platforms.js?v=20261020"></script>
  <script src="cp-daily-log_js/main.js?v=20261020"></script>
</body>

</html>
