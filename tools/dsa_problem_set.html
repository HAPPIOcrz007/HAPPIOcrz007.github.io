<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Problem Set</title>
  <meta name="description" content="An ordered DSA practice set of about 1,100 problems across LeetCode, Codeforces and more. Sync your progress, tick problems, star ones to revise, and back up your progress as a file.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://happiocrz007.github.io/tools/dsa_problem_set.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Harshvardhan Rathod Portfolio">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="DSA Problem Set | Harshvardhan Rathod">
  <meta property="og:description" content="An ordered DSA practice set of about 1,100 problems across LeetCode, Codeforces and more. Sync your progress, tick problems, and star ones to revise.">
  <meta property="og:url" content="https://happiocrz007.github.io/tools/dsa_problem_set.html">
  <meta property="og:image" content="https://happiocrz007.github.io/assets/images/tools_4.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DSA Problem Set | Harshvardhan Rathod">
  <meta name="twitter:description" content="An ordered DSA practice set of about 1,100 problems across LeetCode, Codeforces and more. Sync your progress, tick problems, and star ones to revise.">
  <meta name="twitter:image" content="https://happiocrz007.github.io/assets/images/tools_4.png">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F5F0" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem('theme') } catch (e) { }
      document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'))
    })();
  </script>
  <link rel="stylesheet" href="dsa_problem_set_css/style.css">
</head>

<body>
  <header class="top">
    <a class="back" href="../index_tools.html">Back to tools</a>
    <h1><a href="#/">DSA Problem Set</a></h1>
    <form id="sync" class="profile">
      <input id="cfUser" placeholder="Codeforces handle" autocomplete="off" aria-label="Codeforces handle">
      <input id="lcUser" placeholder="LeetCode username" autocomplete="off" aria-label="LeetCode username">
      <button type="submit">Sync solved</button>
      <span id="status" class="muted" role="status"></span>
    </form>
  </header>
  <aside class="notice">
    Every problem links to its original platform. Not affiliated with LeetCode, Codeforces, AtCoder, CSES, SPOJ or any
    other site listed. Progress is stored only in your browser. Content is removed on request.
  </aside>
  <main>
    <div id="stats" class="stats"></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search all problems" aria-label="Search problems">
      <select id="plat" aria-label="Platform"></select>
      <select id="diff" aria-label="Difficulty">
        <option value="">All difficulties</option><option>Novice</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Extreme</option>
      </select>
      <select id="stat" aria-label="Status">
        <option value="">All status</option><option value="solved">Solved</option><option value="unsolved">Unsolved</option><option value="revise">To revise</option>
      </select>
      <button id="exp" type="button">Export progress</button>
      <button id="imp" type="button">Import progress</button>
      <input id="file" type="file" accept="application/json" hidden>
    </div>
    <div id="view"></div>
  </main>
  <script src="../data/dsa_problem_set.js"></script>
  <script src="dsa_problem_set_js/store.js"></script>
  <script src="dsa_problem_set_js/ui.js"></script>
  <script src="dsa_problem_set_js/main.js"></script>
</body>

</html>
